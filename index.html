<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>媛婷雪球大冒險 - 街機傳奇競技場</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for arcade look -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #030712;
            user-select: none;
        }
        /* 街機發光與動態特效 */
        .arcade-neon-blue {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            border-color: #38bdf8;
        }
        .arcade-neon-gold {
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.6);
            border-color: #fbbf24;
        }
        .text-glow-yellow {
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.9), 0 0 2px #000;
        }
        .text-glow-sky {
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
        }
        /* 隱藏滾動條 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b1329;
        }
        ::-webkit-scrollbar-thumb {
            background: #38bdf8;
            border-radius: 3px;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-2 sm:p-4 overflow-x-hidden">

    <!-- React 根目錄 -->
    <div id="root" class="w-full max-w-7xl"></div>

    <!-- 載入 React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- React 應用代碼 -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const PRESET_FRIENDS = [
            { id: "f1", name: "冰雪奇緣小艾", level: 14, guild: "極地冰晶社", status: "在線中" },
            { id: "f2", name: "滾雪球大師", level: 28, guild: "極速超跑閣", status: "大廳中" },
            { id: "f3", name: "暖冬熱可可", level: 9, guild: "無公會", status: "戰鬥中" },
            { id: "f4", name: "哈士奇不拉雪橇", level: 16, guild: "哈士奇拆家團", status: "離線" }
        ];

        const PRESET_GUILDS = [
            { name: "極地冰晶社", leader: "冰雪奇緣小艾", activePoints: 1250, members: 42 },
            { name: "極速超跑閣", leader: "滾雪球大師", activePoints: 980, members: 31 },
            { name: "冰天雪地狂熱班", leader: "冷氣吹不用錢", activePoints: 720, members: 18 }
        ];

        const INITIAL_SHOP_ITEMS = [
            { id: "shield", name: "戰略防護罩", price: 30, desc: "可在戰場擋住一次雪球攻擊，最多可儲備 3 個（F1-F3 鍵觸發）", type: "shield" },
            { id: "ring", name: "真愛承諾戒指", price: 99, desc: "用於向好友表白結為伴侶。享有雙人BUFF：經驗+10%、勝利點數+10、失敗+5！", type: "ring" },
            { id: "speed_boots", name: "疾風雪鞋", price: 120, desc: "永久提升角色移動速度 20%（極速閃避專用）", type: "speed" },
            { id: "golden_coat", name: "土豪金保暖大衣", price: 200, desc: "將角色外觀改為尊貴璀璨黃金，金光四射閃耀賽場！", type: "skin_gold" }
        ];

        const BOT_NAMES = ["雪山小精靈", "企鵝班長", "北極熊大叔", "冰原雪人阿光", "急凍草莓醬", "聖誕特工", "滑雪天才強尼", "急凍人阿爾法"];
        const GUEST_NAMES = ["雪原遊俠", "急凍奇兵", "冰河踏破者", "傲雪狂瀾", "冰晶流星"];

        const getSavedData = (key, defaultVal) => {
            try {
                const saved = localStorage.getItem(key);
                return saved ? JSON.parse(saved) : defaultVal;
            } catch (e) {
                console.error("讀取 LocalStorage 失敗:", key);
                return defaultVal;
            }
        };

        function App() {
            const [user, setUser] = useState(() => getSavedData("snow_user", null));
            const [regUser, setRegUser] = useState("");
            const [regPass, setRegPass] = useState("");
            const [regEmail, setRegEmail] = useState("");
            const [loginUser, setLoginUser] = useState("");
            const [loginPass, setLoginPass] = useState("");
            const [authError, setAuthError] = useState("");
            const [authSuccess, setAuthSuccess] = useState("");

            // GM 後台狀態控制
            const [isGM, setIsGM] = useState(true); // 預設使用者為 GM，使其可看見並操作 GM 管理後台
            
            // 玩家屬性狀態
            const [playerStats, setPlayerStats] = useState(() => {
                return getSavedData("snow_player_stats", {
                    points: 500, // 給予充足初始點數以便測試商城
                    level: 5,
                    exp: 30,
                    shields: 2,
                    rings: 1,
                    partner: "暖冬熱可可", // 預設伴侶
                    guildName: "極地冰晶社", 
                    guildTitle: "極地長老", 
                    purchasedItems: [] 
                });
            });

            const [shopItems, setShopItems] = useState(() => getSavedData("snow_shop_items", INITIAL_SHOP_ITEMS));
            const [newItemName, setNewItemName] = useState("");
            const [newItemPrice, setNewItemPrice] = useState("");
            const [newItemDesc, setNewItemDesc] = useState("");
            const [newItemType, setNewItemType] = useState("cosmetic");

            const [friends, setFriends] = useState(() => getSavedData("snow_friends", PRESET_FRIENDS));
            const [newFriendName, setNewFriendName] = useState("");
            const [guilds, setGuilds] = useState(() => getSavedData("snow_guilds", PRESET_GUILDS));
            const [newGuildName, setNewGuildName] = useState("");
            const [customTitle, setCustomTitle] = useState("");

            // 告白系統
            const [confessTarget, setConfessTarget] = useState(null);
            const [confessText, setConfessText] = useState("");

            const [activeTab, setActiveTab] = useState("lobby"); 

            // 競技房間匹配狀態
            const [matchSize, setMatchSize] = useState(2); 
            const [matchType, setMatchType] = useState("AI"); 
            const [blueTeam, setBlueTeam] = useState(["玩家", null, null]); 
            const [redTeam, setRedTeam] = useState([null, null, null]); 
            const [lobbyMessage, setLobbyMessage] = useState("");
            
            // 遊戲執行狀態
            const [isMatching, setIsMatching] = useState(false);
            const [matchTimer, setMatchTimer] = useState(0);
            const [gameActive, setGameActive] = useState(false);
            const [gameResult, setGameResult] = useState(null); 
            const [showCustomModal, setShowCustomModal] = useState(null); 

            useEffect(() => {
                if (user) {
                    localStorage.setItem("snow_user", JSON.stringify(user));
                } else {
                    localStorage.removeItem("snow_user");
                }
            }, [user]);

            useEffect(() => {
                localStorage.setItem("snow_player_stats", JSON.stringify(playerStats));
            }, [playerStats]);

            useEffect(() => {
                localStorage.setItem("snow_shop_items", JSON.stringify(shopItems));
            }, [shopItems]);

            useEffect(() => {
                localStorage.setItem("snow_friends", JSON.stringify(friends));
            }, [friends]);

            useEffect(() => {
                localStorage.setItem("snow_guilds", JSON.stringify(guilds));
            }, [guilds]);

            const triggerAlert = (title, msg) => {
                setShowCustomModal({ title, msg });
            };

            const handleGuestLogin = () => {
                const randomId = Math.floor(Math.random() * 900) + 100;
                const prefix = GUEST_NAMES[Math.floor(Math.random() * GUEST_NAMES.length)];
                const guestName = `${prefix}_${randomId}`;
                const guestUser = { username: guestName, email: "guest@snowball.com", isGuest: true };
                
                setUser(guestUser);
                setBlueTeam([guestName, null, null]);
                setAuthSuccess(`已使用玩家身分「${guestName}」登入！`);
                setAuthError("");
            };

            const handleRegister = (e) => {
                e.preventDefault();
                if (!regUser || !regPass || !regEmail) {
                    setAuthError("請填寫所有欄位！");
                    return;
                }
                const newUserObj = { username: regUser, password: regPass, email: regEmail, isGuest: false };
                setUser(newUserObj);
                setBlueTeam([regUser, null, null]);
                setAuthError("");
                setAuthSuccess("註冊成功！已自動登入。");
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (!loginUser || !loginPass) {
                    setAuthError("請輸入使用者帳號及密碼！");
                    return;
                }
                const mockUserObj = { username: loginUser, email: `${loginUser}@snowball.com`, isGuest: false };
                setUser(mockUserObj);
                setBlueTeam([loginUser, null, null]);
                setAuthError("");
                setAuthSuccess(`歡迎回來，極地戰士 ${loginUser}！`);
            };

            const handleLogout = () => {
                setUser(null);
                setAuthSuccess("");
                setAuthError("");
                setBlueTeam(["玩家", null, null]);
                setRedTeam([null, null, null]);
            };

            const buyItem = (item) => {
                if (playerStats.points < item.price) {
                    triggerAlert("點數不足", `您的點數不夠購買 ${item.name}！ (商品價格 ${item.price} 元，您目前擁有 ${playerStats.points} 元)`);
                    return;
                }

                if (item.id === "shield") {
                    if (playerStats.shields >= 3) {
                        triggerAlert("儲備已達上限", "每名戰士最多只能攜帶 3 個防護罩！請進入戰場使用後再行補充。");
                        return;
                    }
                    setPlayerStats(prev => ({
                        ...prev,
                        points: prev.points - item.price,
                        shields: prev.shields + 1
                    }));
                    triggerAlert("購買成功", `已成功購買防護罩！當前攜帶量：${playerStats.shields + 1} / 3`);
                } else if (item.id === "ring") {
                    setPlayerStats(prev => ({
                        ...prev,
                        points: prev.points - item.price,
                        rings: (prev.rings || 0) + 1
                    }));
                    triggerAlert("購買成功 💍", `您成功購得真愛承諾戒指 1 個！當前庫存：${(prev.rings || 0) + 1} 個。`);
                } else {
                    if (playerStats.purchasedItems.includes(item.id)) {
                        triggerAlert("重複購買", `您已擁有 ${item.name}，屬性加成已自動生效。`);
                        return;
                    }
                    setPlayerStats(prev => ({
                        ...prev,
                        points: prev.points - item.price,
                        purchasedItems: [...prev.purchasedItems, item.id]
                    }));
                    triggerAlert("購買成功", `已購得裝備：${item.name}，屬性與外觀已即時啟動生效！`);
                }
            };

            const handleUpdatePrice = (itemId, newPrice) => {
                const parsedPrice = parseInt(newPrice, 10);
                if (isNaN(parsedPrice) || parsedPrice < 0) return;
                setShopItems(prev => prev.map(item => item.id === itemId ? { ...item, price: parsedPrice } : item));
            };

            const addCustomItemGM = (e) => {
                e.preventDefault();
                if (!newItemName || !newItemPrice) {
                    triggerAlert("GM 提示", "商品名稱與金額為必填項目！");
                    return;
                }
                const cost = parseInt(newItemPrice, 10);
                const newItem = {
                    id: "gm_" + Date.now(),
                    name: newItemName,
                    price: cost,
                    desc: newItemDesc || "GM 特製傳奇裝備，蘊藏極地神祕法術！",
                    type: newItemType,
                    system: false
                };
                setShopItems(prev => [...prev, newItem]);
                setNewItemName("");
                setNewItemPrice("");
                setNewItemDesc("");
                triggerAlert("GM 操作成功", `新增自定義商品：【${newItemName}】已正式上架！`);
            };

            const deleteItemGM = (id) => {
                setShopItems(prev => prev.filter(item => item.id !== id));
                triggerAlert("GM 操作成功", "商品已從商城中徹底刪除！");
            };

            const createGuild = (e) => {
                e.preventDefault();
                if (!newGuildName.trim()) return;
                if (playerStats.guildName) {
                    triggerAlert("公會提示", "您目前已隸屬於其他公會，請先退會再試！");
                    return;
                }
                if (playerStats.points < 100) {
                    triggerAlert("點數不足", `創立公會需花費 100 元點數。`);
                    return;
                }

                const myName = user ? user.username : "未登入冒險者";
                setPlayerStats(prev => ({
                    ...prev,
                    points: prev.points - 100,
                    guildName: newGuildName,
                    guildTitle: "公會長"
                }));

                const newGuildObj = {
                    name: newGuildName,
                    leader: myName,
                    activePoints: 10,
                    members: 1
                };

                setGuilds(prev => [newGuildObj, ...prev]);
                triggerAlert("公會建立成功！", `恭喜您創立了公會【${newGuildName}】！`);
            };

            const toggleJoinGuild = (gName) => {
                if (playerStats.guildName === gName) {
                    // 點擊已加入的公會 -> 退出
                    setPlayerStats(prev => ({
                        ...prev,
                        guildName: "",
                        guildTitle: "新手冒險者"
                    }));
                    setGuilds(prev => prev.map(g => g.name === gName ? { ...g, members: Math.max(1, g.members - 1) } : g));
                    triggerAlert("退出公會", `您已正式退出【${gName}】公會。`);
                } else {
                    // 點擊其他公會 -> 加入 (會先退出原本的)
                    const prevGuild = playerStats.guildName;
                    setPlayerStats(prev => ({
                        ...prev,
                        guildName: gName,
                        guildTitle: "極地骨幹"
                    }));
                    setGuilds(prev => prev.map(g => {
                        if (g.name === gName) return { ...g, members: g.members + 1 };
                        if (g.name === prevGuild) return { ...g, members: Math.max(1, g.members - 1) };
                        return g;
                    }));
                    triggerAlert("加入公會", `您已成功加入【${gName}】公會！`);
                }
            };

            const updateLeaderTitle = (e) => {
                e.preventDefault();
                if (!customTitle.trim() || customTitle.length > 5) {
                    triggerAlert("修改失敗", "職稱長度上限為 5 個字！");
                    return;
                }
                setPlayerStats(prev => ({ ...prev, guildTitle: customTitle }));
                triggerAlert("職稱更動成功", `您的頭銜已更新為：【${customTitle}】`);
            };

            const handleConfessSubmit = (e) => {
                e.preventDefault();
                if (!confessTarget) return;

                if (!playerStats.rings || playerStats.rings < 1) {
                    triggerAlert("追求失敗 💍", "您需要先去商城購買戒指！");
                    return;
                }

                setPlayerStats(prev => ({
                    ...prev,
                    rings: Math.max(0, prev.rings - 1),
                    partner: confessTarget.name
                }));

                const name = confessTarget.name;
                setConfessTarget(null);
                setConfessText("");
                triggerAlert("❤️ 追求成功 ❤️", `在漫天風雪中，${name} 欣然接受了您的求婚戒指！\n\n結為伴侶！經驗+10%、勝利額外+10點數、失敗額外+5點數！`);
            };

            const handleSwitchTeam = (side, index) => {
                const myName = user ? user.username : "玩家";
                let newBlue = [...blueTeam];
                let newRed = [...redTeam];

                newBlue = newBlue.map(slot => slot === myName ? null : slot);
                newRed = newRed.map(slot => slot === myName ? null : slot);

                if (side === "BLUE") {
                    newBlue[index] = myName;
                } else {
                    newRed[index] = myName;
                }

                setBlueTeam(newBlue);
                setRedTeam(newRed);
                setLobbyMessage(`您已變更至 ${side === "BLUE" ? "藍方" : "紅方"} 第 ${index + 1} 席。`);
            };

            const inviteFriendToLobby = (friendName) => {
                let newBlue = [...blueTeam];
                let newRed = [...redTeam];

                if (newBlue.includes(friendName) || newRed.includes(friendName)) return;

                const emptyBlueIdx = newBlue.findIndex((slot, i) => slot === null && i < matchSize);
                if (emptyBlueIdx !== -1) {
                    newBlue[emptyBlueIdx] = friendName;
                    setBlueTeam(newBlue);
                    return;
                }

                const emptyRedIdx = newRed.findIndex((slot, i) => slot === null && i < matchSize);
                if (emptyRedIdx !== -1) {
                    newRed[emptyRedIdx] = friendName;
                    setRedTeam(newRed);
                }
            };

            const clearSlot = (side, index) => {
                if (side === "BLUE") {
                    const temp = [...blueTeam];
                    temp[index] = null;
                    setBlueTeam(temp);
                } else {
                    const temp = [...redTeam];
                    temp[index] = null;
                    setRedTeam(temp);
                }
            };

            const autofillAI = () => {
                const myName = user ? user.username : "玩家";
                let newBlue = [...blueTeam];
                let newRed = [...redTeam];

                if (!newBlue.includes(myName) && !newRed.includes(myName)) {
                    newBlue[0] = myName;
                }

                for (let i = 0; i < 3; i++) {
                    if (i >= matchSize) {
                        newBlue[i] = null;
                        newRed[i] = null;
                    } else {
                        if (newBlue[i] === null) {
                            newBlue[i] = "電腦·" + BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
                        }
                        if (newRed[i] === null) {
                            newRed[i] = "電腦·" + BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
                        }
                    }
                }
                setBlueTeam(newBlue);
                setRedTeam(newRed);
            };

            const startMatchmaking = () => {
                autofillAI();
                setIsMatching(true);
                setMatchTimer(3); 
            };

            useEffect(() => {
                let ticker;
                if (isMatching && matchTimer > 0) {
                    ticker = setInterval(() => {
                        setMatchTimer(prev => prev - 1);
                    }, 1000);
                } else if (isMatching && matchTimer === 0) {
                    setIsMatching(false);
                    setGameActive(true); 
                }
                return () => clearInterval(ticker);
            }, [isMatching, matchTimer]);

            const handleFinishGame = (status) => {
                setGameActive(false);

                let earnedPoints = 0;
                let expGained = 0;
                let activeGained = playerStats.guildName ? (status === "WIN" ? 10 : 3) : 0;

                if (status === "WIN") {
                    earnedPoints = Math.floor(Math.random() * 6) + 5; // 5 ~ 10 元
                    expGained = Math.floor(Math.random() * 15) + 15; 
                } else {
                    earnedPoints = Math.floor(Math.random() * 3) + 1; // 1 ~ 3 元
                    expGained = Math.floor(Math.random() * 8) + 5;   
                }

                // 伴侶加成效果
                if (playerStats.partner) {
                    expGained = Math.round(expGained * 1.1); // +10% 經驗
                    earnedPoints += (status === "WIN" ? 10 : 5); // 贏+10元，輸+5元
                }

                let curExp = playerStats.exp + expGained;
                let curLevel = playerStats.level;
                const expNeeded = curLevel * 100;
                if (curExp >= expNeeded) {
                    curExp -= expNeeded;
                    curLevel += 1;
                }

                setPlayerStats(prev => ({
                    ...prev,
                    points: prev.points + earnedPoints,
                    level: curLevel,
                    exp: curExp
                }));

                if (playerStats.guildName) {
                    setGuilds(prev => prev.map(g => {
                        if (g.name === playerStats.guildName) {
                            return { ...g, activePoints: g.activePoints + activeGained };
                        }
                        return g;
                    }));
                }

                setGameResult({
                    status,
                    rewardPoints: earnedPoints,
                    expGained,
                    guildGained: activeGained
                });
            };

            return (
                <div class="relative bg-slate-900 border-4 border-sky-400 rounded-3xl overflow-hidden shadow-2xl min-h-[680px] flex flex-col max-w-6xl mx-auto arcade-neon-blue">
                    
                    <div class="h-2 bg-gradient-to-r from-sky-400 via-teal-400 to-indigo-500"></div>

                    {/* 頂部導航資訊列 */}
                    <header class="bg-slate-950 px-4 sm:px-6 py-4 border-b border-sky-950 flex flex-wrap justify-between items-center gap-4">
                        <div class="flex items-center gap-3">
                            <div class="w-11 h-11 bg-sky-500 rounded-xl flex items-center justify-center font-bold text-slate-900 shadow-[0_0_12px_rgba(56,189,248,0.7)] text-2xl animate-pulse">
                                ❄️
                            </div>
                            <div>
                                <h2 class="text-xl sm:text-2xl font-black text-sky-300 tracking-wider flex items-center gap-2">
                                    雪球冒險 2.5D <span class="text-[10px] bg-red-500 text-white px-2 py-0.5 rounded-full font-bold">街機重製版</span>
                                </h2>
                                <p class="text-xs text-sky-100/60 font-semibold">經典復古 1P vs 2P 冰上大亂鬥</p>
                            </div>
                        </div>

                        {/* GM 控制快速切換與玩家狀態 */}
                        <div class="flex items-center gap-4">
                            <button 
                                onClick={() => setIsGM(!isGM)} 
                                class={`px-3 py-1.5 rounded-lg text-xs font-black tracking-widest transition-all ${isGM ? "bg-amber-500 text-slate-950 arcade-neon-gold" : "bg-slate-800 text-slate-400 hover:text-slate-200"}`}
                            >
                                {isGM ? "👑 GM 後台已開啟" : "🔒 開啟 GM 權限"}
                            </button>

                            {user ? (
                                <div class="flex flex-wrap items-center gap-2 sm:gap-4 text-xs sm:text-sm">
                                    <div class="bg-slate-900 border border-sky-900 px-3 py-1.5 rounded-lg flex items-center gap-2">
                                        <span class="text-sky-300 font-extrabold">
                                            👤 {playerStats.guildName ? `[${playerStats.guildName} · ${playerStats.guildTitle}] ` : ""}{user.username}
                                        </span>
                                        <span class="bg-sky-500 text-slate-950 text-[10px] px-1.5 py-0.2 rounded font-black">Lv.{playerStats.level}</span>
                                    </div>

        // ==================== HTML5 Canvas 2.5D 街機風格引擎 ====================
        function GameCanvas({ blueTeam, redTeam, playerStats, setPlayerStats, onFinishGame }) {
            const canvasRef = useRef(null);

            const hasSpeedBoots = playerStats.purchasedItems.includes("speed_boots");
            const hasGoldCoat = playerStats.purchasedItems.includes("golden_coat");

            // 使用 Ref 隔離狀態變量
            const engineState = useRef({
                player: {
                    x: 0,
                    z: 50,
                    hp: 100,
                    isDodging: false,
                    dodgeTimer: 0,
                    shieldActive: false,
                    shieldTimeout: 0,
                    isDead: false,
                    speed: hasSpeedBoots ? 6.2 : 5.0,
                    spacePressedTime: 0
                },
                allies: [],
                enemies: [],
                snowballs: [],
                particles: [],
                dustTrails: [],      // 黃褐色滑動尾跡效果，完美還原螢幕截圖
                floatingTexts: [],  
                backgroundSnow: [], 
                gameTimer: 35,
                lastSnowballSpawn: 0,
                keys: {},
                gameLoopId: null,
                roundState: "intro", // "intro", "fight", "active"
                roundIntroTimer: 120 // 用於開場 Round 1 與 Fight!! 動畫
            });

            useEffect(() => {
                const state = engineState.current;
                const canvas = canvasRef.current;
                if (!canvas) return;

                state.player.hp = 100;
                state.player.x = 0;
                state.player.z = 50;
                state.player.isDodging = false;
                state.player.shieldActive = false;
                state.player.isDead = false;
                state.player.speed = hasSpeedBoots ? 6.2 : 5.0;
                state.player.spacePressedTime = 0;
                
                state.snowballs = [];
                state.particles = [];
                state.dustTrails = [];
                state.floatingTexts = [];
                state.gameTimer = 35;
                state.roundState = "intro";
                state.roundIntroTimer = 120; // 2秒開場秀

                // 隨機生成背景飄雪粒子
                state.backgroundSnow = Array.from({ length: 40 }).map(() => ({
                    x: Math.random() * 800,
                    y: Math.random() * 450,
                    vy: Math.random() * 1.2 + 0.6,
                    vx: Math.random() * 0.4 - 0.2,
                    size: Math.random() * 2 + 1
                }));

                // 初始化盟友
                state.allies = blueTeam
                    .filter(name => name !== "玩家" && name !== (playerStats.username || "玩家"))
                    .map((name, idx) => ({
                        id: `ally_${idx}`,
                        name: name,
                        x: -70 - idx * 45,
                        z: 60 + idx * 15,
                        hp: 100,
                        isDodging: false,
                        dodgeTimer: 0,
                        isDead: false,
                        color: "#38bdf8",
                        aiTimer: 0,
                        aiState: "wander"
                    }));

                // 初始化敵人
                state.enemies = redTeam.map((name, idx) => ({
                    id: `enemy_${idx}`,
                    name: name,
                    x: 70 + idx * 45,
                    z: 70 + idx * 15,
                    hp: 100,
                    isDodging: false,
                    dodgeTimer: 0,
                    isDead: false,
                    color: "#f87171",
                    aiTimer: 0,
                    aiState: "wander"
                }));

                const handleKeyDown = (e) => {
                    state.keys[e.key] = true;
                    if (e.key === "F1" || e.key === "F2" || e.key === "F3") {
                        e.preventDefault();
                        triggerShieldDeploy();
                    }
                };

                const handleKeyUp = (e) => {
                    state.keys[e.key] = false;
                    
                    if (e.key === " ") {
                        const pressDuration = Date.now() - state.player.spacePressedTime;
                        if (pressDuration < 220) {
                            if (!state.player.isDodging && !state.player.isDead) {
                                state.player.isDodging = true;
                                state.player.dodgeTimer = 30; 
                                createBurstParticles(state.player.x, state.player.z, "#fef08a", 12);
                                state.floatingTexts.push({
                                    x: state.player.x,
                                    z: state.player.z,
                                    y: 35,
                                    text: "DODGE! 翻滾",
                                    color: "#fbbf24",
                                    alpha: 1,
                                    speedY: 0.6
                                });
                            }
                        }
                        state.player.spacePressedTime = 0;
                    }
                };

                const handleWindowBlur = () => {
                    state.keys = {};
                };

                window.addEventListener("keydown", handleKeyDown);
                window.addEventListener("keyup", handleKeyUp);
                window.addEventListener("blur", handleWindowBlur);

                // 2.5D 主更新與渲染循環
                const render = () => {
                    updatePhysics();
                    drawFrame();
                    state.gameLoopId = requestAnimationFrame(render);
                };
                state.gameLoopId = requestAnimationFrame(render);

                const gameCountdown = setInterval(() => {
                    if (state.roundState === "active") {
                        state.gameTimer -= 1;
                        if (state.gameTimer <= 0) {
                            clearInterval(gameCountdown);
                            const blueHPTotal = state.player.hp + state.allies.reduce((sum, a) => sum + (a.isDead ? 0 : a.hp), 0);
                            const redHPTotal = state.enemies.reduce((sum, e) => sum + (e.isDead ? 0 : e.hp), 0);
                            if (blueHPTotal >= redHPTotal) {
                                onFinishGame("WIN");
                            } else {
                                onFinishGame("LOSS");
                            }
                        }
                    }
                }, 1000);

                return () => {
                    window.removeEventListener("keydown", handleKeyDown);
                    window.removeEventListener("keyup", handleKeyUp);
                    window.removeEventListener("blur", handleWindowBlur);
                    cancelAnimationFrame(state.gameLoopId);
                    clearInterval(gameCountdown);
                };
            }, [blueTeam, redTeam]);

            const createBurstParticles = (x, z, color, count) => {
                const state = engineState.current;
                for (let i = 0; i < count; i++) {
                    state.particles.push({
                        x: x,
                        z: z,
                        y: 5 + Math.random() * 15,
                        vx: Math.random() * 4 - 2,
                        vz: Math.random() * 4 - 2,
                        vy: Math.random() * 3 + 2,
                        color: color,
                        alpha: 1
                    });
                }
            };

            const triggerShieldDeploy = () => {
                const state = engineState.current;
                if (state.player.isDead) return;

                if (playerStats.shields > 0) {
                    if (state.player.shieldActive) return;

                    state.player.shieldActive = true;
                    state.player.shieldTimeout = 300; 

                    setPlayerStats(prev => ({
                        ...prev,
                        shields: Math.max(0, prev.shields - 1)
                    }));

                    createBurstParticles(state.player.x, state.player.z, "#22d3ee", 15);
                    state.floatingTexts.push({
                        x: state.player.x,
                        z: state.player.z,
                        y: 40,
                        text: "SHIELD ON!",
                        color: "#22d3ee",
                        alpha: 1,
                        speedY: 0.5
                    });
                }
            };

            const project = (x, y, z, width, height) => {
                const horizonY = 140; 
                const scale = 0.15 + (0.85 * (200 - z)) / 180;
                const screenX = width / 2 + x * scale;
                const screenY = horizonY + (height - horizonY) * ((200 - z) / 180) - y * scale;
                return { x: screenX, y: screenY, scale: scale };
            };

            const updatePhysics = () => {
                const state = engineState.current;

                // 開場動畫定時
                if (state.roundState === "intro") {
                    state.roundIntroTimer -= 1;
                    if (state.roundIntroTimer === 60) {
                        state.roundState = "fight";
                    }
                } else if (state.roundState === "fight") {
                    state.roundIntroTimer -= 1;
                    if (state.roundIntroTimer <= 0) {
                        state.roundState = "active";
                    }
                }

                if (state.player.isDead) return;

                // 飄落細雪
                state.backgroundSnow.forEach(snowflake => {
                    snowflake.y += snowflake.vy;
                    snowflake.x += snowflake.vx;
                    if (snowflake.y > 450) {
                        snowflake.y = -10;
                        snowflake.x = Math.random() * 800;
                    }
                });

                // 控制輸入
                let inputX = 0;
                let inputZ = 0;

                if (state.keys["ArrowLeft"] || state.keys["a"] || state.keys["A"]) inputX = -1;
                if (state.keys["ArrowRight"] || state.keys["d"] || state.keys["D"]) inputX = 1;
                if (state.keys["ArrowUp"] || state.keys["w"] || state.keys["W"]) inputZ = -1;
                if (state.keys["ArrowDown"] || state.keys["s"] || state.keys["S"]) inputZ = 1;

                let isMoving = inputX !== 0 || inputZ !== 0;

                // 產生滑溜軌跡黃褐色雪粒 (完美還原螢幕截圖 151813.jpg 的滑動感)
                if (isMoving && Math.random() < 0.4 && state.roundState === "active") {
                    state.dustTrails.push({
                        x: state.player.x + (Math.random() * 10 - 5),
                        z: state.player.z,
                        size: Math.random() * 5 + 3,
                        alpha: 0.8
                    });
                }

                if (state.keys[" "]) {
                    if (state.player.spacePressedTime === 0) {
                        state.player.spacePressedTime = Date.now();
                    }
                    const pressDuration = Date.now() - state.player.spacePressedTime;
                    if (pressDuration >= 220) {
                        inputZ = 1; 
                        state.player.x += inputX * (state.player.speed * 0.4); 
                        state.player.z += inputZ * (state.player.speed * 0.6); 
                    } else {
                        state.player.x += inputX * state.player.speed;
                        state.player.z += inputZ * state.player.speed;
                    }
                } else {
                    state.player.x += inputX * state.player.speed;
                    state.player.z += inputZ * state.player.speed;
                }

                state.player.x = Math.max(-175, Math.min(175, state.player.x));
                state.player.z = Math.max(25, Math.min(185, state.player.z));

                if (state.player.isDodging) {
                    state.player.dodgeTimer -= 1;
                    if (state.player.dodgeTimer <= 0) {
                        state.player.isDodging = false;
                    }
                }
                if (state.player.shieldActive) {
                    state.player.shieldTimeout -= 1;
                    if (state.player.shieldTimeout <= 0) {
                        state.player.shieldActive = false;
                    }
                }

                // AI 行為
                const runAI = (char) => {
                    char.aiTimer -= 1;
                    const threat = state.snowballs.find(ball => {
                        const depthGap = ball.z - char.z;
                        return depthGap > 0 && depthGap < 65 && Math.abs(ball.x - char.x) < 35;
                    });

                    if (threat) {
                        char.aiState = "escape";
                        if (threat.x < char.x) {
                            char.x += 3.2;
                        } else {
                            char.x -= 3.2;
                        }
                    } else {
                        if (char.aiTimer <= 0) {
                            char.aiState = Math.random() > 0.35 ? "wander" : "idle";
                            char.aiTimer = Math.random() * 50 + 20;
                            char.targetX = char.x + (Math.random() * 50 - 25);
                        }
                        if (char.aiState === "wander" && char.targetX !== undefined) {
                            const diffX = char.targetX - char.x;
                            if (Math.abs(diffX) > 4) {
                                char.x += Math.sign(diffX) * 1.5;
                            }
                        }
                    }

                    char.x = Math.max(-170, Math.min(170, char.x));

                    if (char.isDodging) {
                        char.dodgeTimer -= 1;
                        if (char.dodgeTimer <= 0) {
                            char.isDodging = false;
                        }
                    }
                };

                state.allies.forEach(a => { if (!a.isDead) runAI(a); });
                state.enemies.forEach(e => { if (!e.isDead) runAI(e); });

                if (state.roundState === "active") {
                    const now = Date.now();
                    const progressFactor = (35 - state.gameTimer) / 35;
                    const spawnInterval = Math.max(450, 1300 - progressFactor * 850); 

                    if (now - state.lastSnowballSpawn > spawnInterval) {
                        state.lastSnowballSpawn = now;
                        const isHuge = Math.random() < (0.2 + progressFactor * 0.15);
                        state.snowballs.push({
                            id: `ball_${now}`,
                            x: Math.random() * 300 - 150, 
                            z: 200,                        
                            size: isHuge ? "large" : "small",
                            damage: isHuge ? 10 : 5,
                            speed: (Math.random() * 2 + 3
