<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雪球冒險 2.5D - 團隊競技冰上躲避球</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for retro/arcade look -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #030712;
            user-select: none;
        }
        /* 復古發光與動畫特效 */
        .arcade-neon-blue {
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.7);
            border-color: #38bdf8;
        }
        .arcade-neon-red {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.7);
            border-color: #ef4444;
        }
        .text-glow-sky {
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
        }
        .text-glow-yellow {
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.9), 0 0 2px #000;
        }
        /* 隱藏滾動條 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b1329;
        }
        ::-webkit-scrollbar-thumb {
            background: #38bdf8;
            border-radius: 3px;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-2 sm:p-4 overflow-x-hidden">

    <!-- React 根目錄 -->
    <div id="root" class="w-full max-w-7xl"></div>

    <!-- 載入 React -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel 用於編譯 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- React 應用代碼 -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==================== 預設靜態與初始數據 ====================
        const PRESET_FRIENDS = [
            { id: "f1", name: "冰雪奇緣小艾", level: 14, guild: "極地冰晶社", status: "在線中" },
            { id: "f2", name: "滾雪球大師", level: 28, guild: "極速超跑閣", status: "大廳中" },
            { id: "f3", name: "暖冬熱可可", level: 9, guild: "無公會", status: "戰鬥中" },
            { id: "f4", name: "哈士奇不拉雪橇", level: 16, guild: "哈士奇拆家團", status: "離線" }
        ];

        const PRESET_GUILDS = [
            { name: "極地冰晶社", leader: "冰雪奇緣小艾", activePoints: 1250, members: 42 },
            { name: "極速超跑閣", leader: "滾雪球大師", activePoints: 980, members: 31 },
            { name: "冰天雪地狂熱班", leader: "冷氣吹不用錢", activePoints: 720, members: 18 }
        ];

        const INITIAL_SHOP_ITEMS = [
            { id: "shield", name: "戰略防護罩", price: 30, desc: "可在戰場擋住一次雪球攻擊，最多可儲備 3 個（遊戲內 F1-F3 鍵即時觸發）", type: "shield", system: true },
            { id: "ring", name: "真愛承諾戒指", price: 99, desc: "用於向好友表白結為伴侶。享有雙人專屬BUFF：經驗獲得+10%、勝利點數額外+10元、失敗額外+5元！", type: "ring", system: true },
            { id: "speed_boots", name: "疾風雪鞋", price: 120, desc: "永久提升角色移動速度 20%（極速閃避專用）", type: "speed", system: true },
            { id: "golden_coat", name: "土豪金保暖大衣", price: 200, desc: "將角色外觀改為尊貴璀璨黃金，金光四射閃耀賽場！", type: "skin_gold", system: true }
        ];

        const BOT_NAMES = ["哈士奇寶寶", "企鵝班長", "北極熊大叔", "冰原雪人阿光", "急凍草莓醬", "聖誕特工", "滑雪天才強尼", "寒冰大作戰", "急凍人阿爾法"];
        const GUEST_NAMES = ["雪原遊俠", "急凍奇兵", "冰河踏破者", "傲雪狂瀾", "冰晶流星"];

        // 安全 parsing 函數，防止 parse 毀損的 LocalStorage
        const getSavedData = (key, defaultVal) => {
            try {
                const saved = localStorage.getItem(key);
                return saved ? JSON.parse(saved) : defaultVal;
            } catch (e) {
                console.error("讀取本地數據失敗，已載入預設值:", key);
                return defaultVal;
            }
        };

        // ==================== 主 React 組件 ====================
        function App() {
            // --- 帳號與登入狀態 ---
            const [user, setUser] = useState(() => getSavedData("snow_user", null));
            const [regUser, setRegUser] = useState("");
            const [regPass, setRegPass] = useState("");
            const [regEmail, setRegEmail] = useState("");
            const [loginUser, setLoginUser] = useState("");
            const [loginPass, setLoginPass] = useState("");
            const [authError, setAuthError] = useState("");
            const [authSuccess, setAuthSuccess] = useState("");

            // --- 玩家屬性狀態 ---
            const [playerStats, setPlayerStats] = useState(() => {
                return getSavedData("snow_player_stats", {
                    points: 150, // 初始免費贈送 150 點
                    level: 1,
                    exp: 0,
                    shields: 1,  // 初始擁有 1 個防護罩 (上限 3 個)
                    rings: 0,    // 初始擁有 0 個戒指
                    partner: "", // 初始伴侶為空
                    guildName: "", 
                    guildTitle: "新手冒險者", 
                    purchasedItems: [] 
                });
            });

            // --- 商店動態商品 ---
            const [shopItems, setShopItems] = useState(() => getSavedData("snow_shop_items", INITIAL_SHOP_ITEMS));
            const [newItemName, setNewItemName] = useState("");
            const [newItemPrice, setNewItemPrice] = useState("");
            const [newItemDesc, setNewItemDesc] = useState("");
            const [newItemType, setNewItemType] = useState("cosmetic");

            // --- 好友與公會系統 ---
            const [friends, setFriends] = useState(() => getSavedData("snow_friends", PRESET_FRIENDS));
            const [newFriendName, setNewFriendName] = useState("");
            const [guilds, setGuilds] = useState(() => getSavedData("snow_guilds", PRESET_GUILDS));
            const [newGuildName, setNewGuildName] = useState("");
            const [customTitle, setCustomTitle] = useState("");

            // --- 導覽分頁 ---
            const [activeTab, setActiveTab] = useState("lobby"); // lobby, shop, guild, friends, profile

            // --- 競技房間匹配大廳狀態 ---
            const [matchSize, setMatchSize] = useState(2); // 1 代表 1v1, 2 代表 2v2, 3 代表 3v3
            const [matchType, setMatchType] = useState("AI"); // "AI" 電腦配對, "ONLINE" 真人配對
            const [blueTeam, setBlueTeam] = useState(["玩家", null, null]); 
            const [redTeam, setRedTeam] = useState([null, null, null]); 
            const [lobbyMessage, setLobbyMessage] = useState("");
            
            // --- 遊戲運行狀態 ---
            const [isMatching, setIsMatching] = useState(false);
            const [matchTimer, setMatchTimer] = useState(0);
            const [gameActive, setGameActive] = useState(false);
            const [gameResult, setGameResult] = useState(null); 
            const [showCustomModal, setShowCustomModal] = useState(null); 

            // --- 伴侶告白特有狀態 ---
            const [confessTarget, setConfessTarget] = useState(null);
            const [confessText, setConfessText] = useState("");

            // ==================== LocalStorage 儲存效果同步 ====================
            useEffect(() => {
                if (user) {
                    localStorage.setItem("snow_user", JSON.stringify(user));
                } else {
                    localStorage.removeItem("snow_user");
                }
            }, [user]);

            useEffect(() => {
                localStorage.setItem("snow_player_stats", JSON.stringify(playerStats));
            }, [playerStats]);

            useEffect(() => {
                localStorage.setItem("snow_shop_items", JSON.stringify(shopItems));
            }, [shopItems]);

            useEffect(() => {
                localStorage.setItem("snow_friends", JSON.stringify(friends));
            }, [friends]);

            useEffect(() => {
                localStorage.setItem("snow_guilds", JSON.stringify(guilds));
            }, [guilds]);

            // ==================== 人性化輔助函數 ====================
            const triggerAlert = (title, msg) => {
                setShowCustomModal({ title, msg });
            };

            const handleGuestLogin = () => {
                const randomId = Math.floor(Math.random() * 900) + 100;
                const prefix = GUEST_NAMES[Math.floor(Math.random() * GUEST_NAMES.length)];
                const guestName = `${prefix}_${randomId}`;
                const guestUser = { username: guestName, email: "guest@snowball.com", isGuest: true };
                
                setUser(guestUser);
                setBlueTeam([guestName, null, null]);
                setAuthSuccess(`已使用遊客身分「${guestName}」登入！`);
                setAuthError("");
            };

            // ==================== 登入 / 註冊系統 ====================
            const handleRegister = (e) => {
                e.preventDefault();
                if (!regUser || !regPass || !regEmail) {
                    setAuthError("請確實填寫所有必填欄位！");
                    return;
                }
                if (regUser.length > 10) {
                    setAuthError("使用者帳號長度上限為 10 個字元！");
                    return;
                }
                const newUserObj = { username: regUser, password: regPass, email: regEmail, isGuest: false };
                setUser(newUserObj);
                setBlueTeam([regUser, null, null]);
                setAuthError("");
                setAuthSuccess("恭喜您註冊成功，並已自動為您登入冰雪大廳！");
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (!loginUser || !loginPass) {
                    setAuthError("請輸入使用者帳號及密碼！");
                    return;
                }
                const mockUserObj = { username: loginUser, email: `${loginUser}@snowball.com`, isGuest: false };
                setUser(mockUserObj);
                setBlueTeam([loginUser, null, null]);
                setAuthError("");
                setAuthSuccess(`歡迎回來，尊敬的極地戰士 ${loginUser}！`);
            };

            const handleLogout = () => {
                setUser(null);
                setAuthSuccess("");
                setAuthError("");
                setPlayerStats({
                    points: 150,
                    level: 1,
                    exp: 0,
                    shields: 1,
                    rings: 0,
                    partner: "",
                    guildName: "",
                    guildTitle: "新手冒險者",
                    purchasedItems: []
                });
                setBlueTeam(["玩家", null, null]);
                setRedTeam([null, null, null]);
            };

            // ==================== 商城系統 ====================
            const buyItem = (item) => {
                if (playerStats.points < item.price) {
                    triggerAlert("點數餘額不足", `您的點數不夠購買 ${item.name}！ (商品價格 ${item.price} 元，您目前擁有 ${playerStats.points} 元)`);
                    return;
                }

                if (item.type === "shield") {
                    if (playerStats.shields >= 3) {
                        triggerAlert("儲備已達上限", "每名戰士最多只能攜帶 3 個防護罩！請進入戰場使用後再行補充。");
                        return;
                    }
                    setPlayerStats(prev => ({
                        ...prev,
                        points: prev.points - item.price,
                        shields: prev.shields + 1
                    }));
                    triggerAlert("購買成功", `已成功購買防護罩！當前攜帶量：${playerStats.shields + 1} / 3。在戰場按下 F1~F3 可立刻開啟！`);
                } else if (item.type === "ring") {
                    setPlayerStats(prev => ({
                        ...prev,
                        points: prev.points - item.price,
                        rings: (prev.rings || 0) + 1
                    }));
                    triggerAlert("購買成功 💍", `您成功購得真愛承諾戒指 1 個！可用於在好友列表向心儀的好友告白與締結伴侶關係。當前庫存：${(playerStats.rings || 0) + 1} 個。`);
                } else {
                    // 永久屬性裝備，防止重覆購買
                    if (playerStats.purchasedItems.includes(item.id)) {
                        triggerAlert("重複購買警告", `您已擁有 ${item.name}，不需重複購買！屬性加成已自動生效。`);
                        return;
                    }
                    setPlayerStats(prev => ({
                        ...prev,
                        points: prev.points - item.price,
                        purchasedItems: [...prev.purchasedItems, item.id]
                    }));
                    triggerAlert("購買成功", `已購得裝備：${item.name}，屬性與外觀已即時啟動生效！`);
                }
            };

            const addCustomItem = (e) => {
                e.preventDefault();
                if (!newItemName || !newItemPrice) {
                    triggerAlert("新增商品失敗", "商品名稱與金額為必填項目！");
                    return;
                }
                const cost = parseInt(newItemPrice, 10);
                if (isNaN(cost) || cost <= 0) {
                    triggerAlert("金額輸入錯誤", "請輸入大於 0 的正整數金額。");
                    return;
                }
                const newItem = {
                    id: "custom_" + Date.now(),
                    name: newItemName,
                    price: cost,
                    desc: newItemDesc || "公會自製冰上道具，好用又實惠！",
                    type: newItemType,
                    system: false
                };
                setShopItems(prev => [...prev, newItem]);
                setNewItemName("");
                setNewItemPrice("");
                setNewItemDesc("");
                triggerAlert("商品上架成功", `【${newItemName}】已正式在極地商城發售！`);
            };

            const deleteCustomItem = (id) => {
                setShopItems(prev => prev.filter(item => item.id !== id));
            };

            // ==================== 公會模組 ====================
            const createGuild = (e) => {
                e.preventDefault();
                if (!newGuildName.trim()) {
                    triggerAlert("公會創建失敗", "公會名稱不可為空！");
                    return;
                }
                if (playerStats.guildName) {
                    triggerAlert("公會創建失敗", "您目前已隸屬於其他公會，請先退會再試！");
                    return;
                }
                if (playerStats.points < 100) {
                    triggerAlert("點數不足", `創立新公會需花費 100 元點數，您目前僅有 ${playerStats.points} 元。`);
                    return;
                }

                const myName = user ? user.username : "未登入冒險者";
                setPlayerStats(prev => ({
                    ...prev,
                    points: prev.points - 100,
                    guildName: newGuildName,
                    guildTitle: "公會長"
                }));

                const newGuildObj = {
                    name: newGuildName,
                    leader: myName,
                    activePoints: 10,
                    members: 1
                };

                setGuilds(prev => [newGuildObj, ...prev]);
                setCustomTitle("公會長");
                setNewGuildName("");
                triggerAlert("公會建立成功！", `恭喜您創立了公會【${newGuildName}】，您已被任命為最高領導人「公會長」！`);
            };

            const updateLeaderTitle = (e) => {
                e.preventDefault();
                if (!customTitle.trim()) {
                    triggerAlert("修改職稱失敗", "自定義職稱不可為空！");
                    return;
                }
                if (customTitle.length > 5) {
                    triggerAlert("字數限制", "職稱長度上限為 5 個字（中英文皆算）！");
                    return;
                }
                setPlayerStats(prev => ({
                    ...prev,
                    guildTitle: customTitle
                }));
                triggerAlert("職稱更動成功", `您的會內頭銜已更新為：【${customTitle}】`);
            };

            const joinGuild = (gName) => {
                if (playerStats.guildName) {
                    triggerAlert("無法加入公會", "您目前已在一個公會中了，無法複選。");
                    return;
                }
                setPlayerStats(prev => ({
                    ...prev,
                    guildName: gName,
                    guildTitle: "極地骨幹"
                }));
                setGuilds(prev => prev.map(g => g.name === gName ? { ...g, members: g.members + 1 } : g));
                triggerAlert("加入成功", `您已成功加入【${gName}】，共同爭奪最強公會榮譽！`);
            };

            const leaveGuild = () => {
                const myCurGuild = playerStats.guildName;
                if (!myCurGuild) return;
                setPlayerStats(prev => ({
                    ...prev,
                    guildName: "",
                    guildTitle: "新手冒險者"
                }));
                setGuilds(prev => prev.map(g => g.name === myCurGuild ? { ...g, members: Math.max(1, g.members - 1) } : g));
                triggerAlert("退出公會", `您已正式退出【${myCurGuild}】，重新成為自由人。`);
            };

            // ==================== 好友模組 ====================
            const addFriend = (e) => {
                e.preventDefault();
                const cleanName = newFriendName.trim();
                if (!cleanName) return;
                if (friends.some(f => f.name.toLowerCase() === cleanName.toLowerCase())) {
                    triggerAlert("添加好友失敗", "此人已在您的在線好友列表中。");
                    return;
                }
                const randomLvl = Math.floor(Math.random() * 25) + 3;
                const newFObj = {
                    id: "friend_" + Date.now(),
                    name: cleanName,
                    level: randomLvl,
                    guild: Math.random() > 0.4 ? "極地冰晶社" : "無公會",
                    status: "在大廳中"
                };
                setFriends(prev => [...prev, newFObj]);
                setNewFriendName("");
                triggerAlert("新增好友", `已成功添加玩家 ${cleanName} 為極地好友！`);
            };

            const removeFriend = (id) => {
                setFriends(prev => prev.filter(f => f.id !== id));
            };

            // ==================== 伴侶告白追求系統 ====================
            const handleConfessSubmit = (e) => {
                e.preventDefault();
                if (!confessTarget) return;

                if (!playerStats.rings || playerStats.rings < 1) {
                    triggerAlert("追求失敗 💍", "您的真愛承諾戒指數量不足！請先前往「冰雪商城」花費 99 元點數購買真愛戒指。");
                    return;
                }

                // 消耗戒指、結為伴侶
                setPlayerStats(prev => ({
                    ...prev,
                    rings: Math.max(0, prev.rings - 1),
                    partner: confessTarget.name
                }));

                const targetName = confessTarget.name;
                setConfessTarget(null);
                setConfessText("");

                triggerAlert(
                    "❤️ 追求成功，情投意合 ❤️",
                    `在漫天風雪中，你單膝下跪向 ${targetName} 遞出了真愛戒指，並深情告白：\n「${confessText || "願意與我共度這趟極地冒險嗎？"}」\n\n${targetName} 被你的真情表白打動，羞紅了臉點點頭，欣然接受了你的求婚戒指！\n\n恭喜你們結為極地伴侶！從此享有永久BUFF：經驗值獲取 +10%、勝利獲取額外 +10 元點數、失敗獲取額外 +5 元點數！`
                );
            };

            // ==================== 席位管理（紅藍陣營自選與調配） ====================
            const handleSwitchTeam = (side, index) => {
                const myName = user ? user.username : "玩家";
                let newBlue = [...blueTeam];
                let newRed = [...redTeam];

                // 清除原位置
                newBlue = newBlue.map(slot => slot === myName ? null : slot);
                newRed = newRed.map(slot => slot === myName ? null : slot);

                if (side === "BLUE") {
                    newBlue[index] = myName;
                } else {
                    newRed[index] = myName;
                }

                setBlueTeam(newBlue);
                setRedTeam(newRed);
                setLobbyMessage(`【席位調整】您已移至 ${side === "BLUE" ? "藍色方" : "紅色方"} 的第 ${index + 1} 位。`);
            };

            const inviteFriendToLobby = (friendName) => {
                let newBlue = [...blueTeam];
                let newRed = [...redTeam];

                if (newBlue.includes(friendName) || newRed.includes(friendName)) {
                    triggerAlert("重覆邀請", `【${friendName}】已在當前房間中，無法重覆加入！`);
                    return;
                }

                // 優先分配進藍色方（同隊）
                const emptyBlueIdx = newBlue.findIndex((slot, i) => slot === null && i < matchSize);
                if (emptyBlueIdx !== -1) {
                    newBlue[emptyBlueIdx] = friendName;
                    setBlueTeam(newBlue);
                    triggerAlert("好友入隊", `已成功邀請好友 ${friendName} 加入藍方隊伍。`);
                    return;
                }

                // 次之放入紅色方
                const emptyRedIdx = newRed.findIndex((slot, i) => slot === null && i < matchSize);
                if (emptyRedIdx !== -1) {
                    newRed[emptyRedIdx] = friendName;
                    setRedTeam(newRed);
                    triggerAlert("好友加入對手", `因藍方已滿，已邀請 ${friendName} 加入紅色方對抗！`);
                    return;
                }

                triggerAlert("房間席位已滿", "當前對戰模式之席位均已滿員！請切換到 2v2 或 3v3 多人排位賽。");
            };

            const clearSlot = (side, index) => {
                if (side === "BLUE") {
                    const temp = [...blueTeam];
                    temp[index] = null;
                    setBlueTeam(temp);
                } else {
                    const temp = [...redTeam];
                    temp[index] = null;
                    setRedTeam(temp);
                }
            };

            const autofillAI = () => {
                const myName = user ? user.username : "玩家";
                let newBlue = [...blueTeam];
                let newRed = [...redTeam];

                if (!newBlue.includes(myName) && !newRed.includes(myName)) {
                    newBlue[0] = myName;
                }

                for (let i = 0; i < 3; i++) {
                    if (i >= matchSize) {
                        newBlue[i] = null;
                        newRed[i] = null;
                    } else {
                        if (newBlue[i] === null) {
                            newBlue[i] = "電腦·" + BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
                        }
                        if (newRed[i] === null) {
                            newRed[i] = "電腦·" + BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
                        }
                    }
                }
                setBlueTeam(newBlue);
                setRedTeam(newRed);
                setLobbyMessage("大廳已為雙方陣營補齊高智能虛擬電腦選手！");
            };

            // ==================== 匹配倒數與進入賽事 ====================
            const startMatchmaking = () => {
                autofillAI();
                setIsMatching(true);
                setMatchTimer(3); // 3秒雷達掃描與極地聯絡 countdown
            };

            useEffect(() => {
                let ticker;
                if (isMatching && matchTimer > 0) {
                    ticker = setInterval(() => {
                        setMatchTimer(prev => prev - 1);
                    }, 1000);
                } else if (isMatching && matchTimer === 0) {
                    setIsMatching(false);
                    setGameActive(true); // 開啟 2.5D Canvas
                }
                return () => clearInterval(ticker);
            }, [isMatching, matchTimer]);

            // ==================== 遊戲終止與賽後結算 ====================
            const handleFinishGame = (status) => {
                setGameActive(false);

                // 計算勝利或失敗獲得
                let earnedPoints = 0;
                let expGained = 0;
                let activeGained = 0;

                if (status === "WIN") {
                    earnedPoints = Math.floor(Math.random() * 6) + 5; // 5 ~ 10 元
                    expGained = Math.floor(Math.random() * 15) + 15;  // 15 ~ 30 經驗
                    activeGained = playerStats.guildName ? 10 : 0;
                } else {
                    earnedPoints = Math.floor(Math.random() * 3) + 1; // 1 ~ 3 元
                    expGained = Math.floor(Math.random() * 8) + 5;   // 5 ~ 12 經驗
                    activeGained = playerStats.guildName ? 3 : 0;
                }

                // 伴侶模式加成
                let partnerPointsBonus = 0;
                let partnerExpBonus = 0;
                if (playerStats.partner) {
                    partnerPointsBonus = status === "WIN" ? 10 : 5;
                    partnerExpBonus = Math.round(expGained * 0.1); // 經驗值+10%
                    
                    earnedPoints += partnerPointsBonus;
                    expGained += partnerExpBonus;
                }

                // 經驗值升級判斷
                let curExp = playerStats.exp + expGained;
                let curLevel = playerStats.level;
                const expNeeded = curLevel * 100;
                if (curExp >= expNeeded) {
                    curExp -= expNeeded;
                    curLevel += 1;
                }

                setPlayerStats(prev => ({
                    ...prev,
                    points: prev.points + earnedPoints,
                    level: curLevel,
                    exp: curExp
                }));

                // 增加公會活躍大榜數據
                if (playerStats.guildName) {
                    setGuilds(prev => prev.map(g => {
                        if (g.name === playerStats.guildName) {
                            return { ...g, activePoints: g.activePoints + activeGained };
                        }
                        return g;
                    }));
                }

                setGameResult({
                    status,
                    rewardPoints: earnedPoints,
                    expGained,
                    guildGained: activeGained,
                    partnerPointsBonus,
                    partnerExpBonus
                });
            };

            return (

                            </div>

                                    <span class="text-sky-300 font-extrabold">
                                        👤 {playerStats.guildName ? `[${playerStats.guildName} · ${playerStats.guildTitle}] ` : ""}{user.username}

                player: {
                    x: 0,
                    z: 50,          // Z軸深處安全區： 20 是最前，200 是地平線
                    hp: 100,
                    isDodging: false,
                    dodgeTimer: 0,
                    shieldActive: false,
                    shieldTimeout: 0,
                    isDead: false,
                    speed: hasSpeedBoots ? 5.8 : 4.8,
                    spacePressedTime: 0
                },
                allies: [],
                enemies: [],
                snowballs: [],
                particles: [],
                floatingTexts: [],  // 飄浮傷害/文字特效
                backgroundSnow: [], // 漫天飄舞粒子
                gameTimer: 35,
                lastSnowballSpawn: 0,
                keys: {},
                gameLoopId: null,
                lastTime: 0
            });

            useEffect(() => {
                const state = engineState.current;
                const canvas = canvasRef.current;
                if (!canvas) return;

                // 1. 初始化戰鬥人員屬性
                state.player.hp = 100;
                state.player.x = 0;
                state.player.z = 50;
                state.player.isDodging = false;
                state.player.shieldActive = false;
                state.player.isDead = false;
                state.player.speed = hasSpeedBoots ? 5.8 : 4.8;
                state.player.spacePressedTime = 0;
                
                state.snowballs = [];
                state.particles = [];
                state.floatingTexts = [];
                state.gameTimer = 35;

                // 隨機生成背景飄雪粒子
                state.backgroundSnow = Array.from({ length: 45 }).map(() => ({
                    x: Math.random() * 800,
                    y: Math.random() * 450,
                    vy: Math.random() * 1.5 + 0.5,
                    vx: Math.random() * 0.6 - 0.3,
                    size: Math.random() * 2 + 1
                }));

                // 初始化盟友
                state.allies = blueTeam
                    .filter(name => name !== "玩家" && name !== (playerStats.username || "玩家"))
                    .map((name, idx) => ({
                        id: `ally_${idx}`,
                        name: name,
                        x: -70 - idx * 45,
                        z: 60 + idx * 15,
                        hp: 100,
                        isDodging: false,
                        dodgeTimer: 0,
                        isDead: false,
                        color: "#38bdf8",
                        aiTimer: 0,
                        aiState: "wander"
                    }));

                // 初始化敵人
                state.enemies = redTeam.map((name, idx) => ({
                    id: `enemy_${idx}`,
                    name: name,
                    x: 70 + idx * 45,
                    z: 70 + idx * 15,
                    hp: 100,
                    isDodging: false,
                    dodgeTimer: 0,
                    isDead: false,
                    color: "#f87171",
                    aiTimer: 0,
                    aiState: "wander"
                }));

                // 2. 鍵盤監聽事件（覆寫防堵 F1/F3 等瀏覽器行為）
                const handleKeyDown = (e) => {
                    state.keys[e.key] = true;

                    if (e.key === "F1" || e.key === "F2" || e.key === "F3") {
                        e.preventDefault();
                        triggerShieldDeploy();
                    }
                };

                const handleKeyUp = (e) => {
                    state.keys[e.key] = false;
                    
                    if (e.key === " ") {
                        const pressDuration = Date.now() - state.player.spacePressedTime;
                        // 若短暫點擊空白鍵（小於 220 毫秒）-> 觸發閃避翻滾
                        if (pressDuration < 220) {
                            if (!state.player.isDodging && !state.player.isDead) {
                                state.player.isDodging = true;
                                state.player.dodgeTimer = 30; // 30 幀無敵避傷時間
                                createBurstParticles(state.player.x, state.player.z, "#e2e8f0", 8);
                                state.floatingTexts.push({
                                    x: state.player.x,
                                    z: state.player.z,
                                    y: 35,
                                    text: "DODGE! 翻滾",
                                    color: "#38bdf8",
                                    alpha: 1,
                                    speedY: 0.6
                                });
                            }
                        }
                        state.player.spacePressedTime = 0;
                    }
                };

                // 當視窗焦點流失，自動重置所有按鍵，防止黏鍵
                const handleWindowBlur = () => {
                    state.keys = {};
                };

                window.addEventListener("keydown", handleKeyDown);
                window.addEventListener("keyup", handleKeyUp);
                window.addEventListener("blur", handleWindowBlur);

                // 3. 遊戲 2.5D 主更新渲染循環
                const render = () => {
                    updatePhysics();
                    drawFrame();
                    state.gameLoopId = requestAnimationFrame(render);
                };
                state.gameLoopId = requestAnimationFrame(render);

                // 4. 定時倒數機制
                const gameCountdown = setInterval(() => {
                    state.gameTimer -= 1;
                    if (state.gameTimer <= 0) {
                        clearInterval(gameCountdown);
                        // 時間終止結算存活與 HP 平均
                        const blueHPTotal = state.player.hp + state.allies.reduce((sum, a) => sum + (a.isDead ? 0 : a.hp), 0);
                        const redHPTotal = state.enemies.reduce((sum, e) => sum + (e.isDead ? 0 : e.hp), 0);
                        
                        if (blueHPTotal >= redHPTotal) {
                            onFinishGame("WIN");
                        } else {
                            onFinishGame("LOSS");
                        }
                    }
                }, 1000);

                // 清理監聽
                return () => {
                    window.removeEventListener("keydown", handleKeyDown);
                    window.removeEventListener("keyup", handleKeyUp);
                    window.removeEventListener("blur", handleWindowBlur);
                    cancelAnimationFrame(stateRefId => stateRefId);
                    cancelAnimationFrame(state.gameLoopId);
                    clearInterval(gameCountdown);
                };
            }, [blueTeam, redTeam]);

            // ==================== 粒子系統 ====================
            const createBurstParticles = (x, z, color, count) => {
                const state = engineState.current;
                for (let i = 0; i < count; i++) {
                    state.particles.push({
                        x: x,
                        z: z,
                        y: 5 + Math.random() * 15,
                        vx: Math.random() * 4 - 2,
                        vz: Math.random() * 4 - 2,
                        vy: Math.random() * 3 + 2,
                        color: color,
                        alpha: 1
                    });
                }
            };

            // ==================== 盾牌部署 ====================
            const triggerShieldDeploy = () => {
                const state = engineState.current;
                if (state.player.isDead) return;

                if (playerStats.shields > 0) {
                    if (state.player.shieldActive) return; // 不重複疊加浪費

                    state.player.shieldActive = true;
                    state.player.shieldTimeout = 300; // 防護盾持續 300 幀 (約 5 秒)

                    setPlayerStats(prev => ({
                        ...prev,
                        shields: Math.max(0, prev.shields - 1)
                    }));

                    createBurstParticles(state.player.x, state.player.z, "#22d3ee", 15);
                    state.floatingTexts.push({
                        x: state.player.x,
                        z: state.player.z,
                        y: 40,
                        text: "SHIELD ON! 護盾",
                        color: "#22d3ee",
                        alpha: 1,
                        speedY: 0.5
                    });
                }
            };

            // ==================== 2.5D ground 深度與坐標透視公式 ====================
            // 冰面跑道寬度 x: -160 到 160
            // y: 垂直高度， 0 是冰面
            // z: 距離深度， 200 代表最遠地平線， 20 代表最前景
            const project = (x, y, z, width, height) => {
                const horizonY = 140; // 視平線的高度位置
                // 深度縮放比率： z=200 時 scale=0.15； z=20 時 scale=1.0
                const scale = 0.15 + (0.85 * (200 - z)) / 180;

                const screenX = width / 2 + x * scale;
                // 利用透視比例決定在視平線之下的跑道高度
                const screenY = horizonY + (height - horizonY) * ((200 - z) / 180) - y * scale;

                return { x: screenX, y: screenY, scale: scale };
            };

            // ==================== 核心物理演算機制 ====================
            const updatePhysics = () => {
                const state = engineState.current;
                if (state.player.isDead) return;

                // --- 1. 背景飄雪物理運動 ---
                state.backgroundSnow.forEach(snowflake => {
                    snowflake.y += snowflake.vy;
                    snowflake.x += snowflake.vx;
                    if (snowflake.y > 450) {
                        snowflake.y = -10;
                        snowflake.x = Math.random() * 800;
                    }
                });

                // --- 2. 玩家操控物理 ---
                let inputX = 0;
                let inputZ = 0;

                if (state.keys["ArrowLeft"] || state.keys["a"] || state.keys["A"]) inputX = -1;
                if (state.keys["ArrowRight"] || state.keys["d"] || state.keys["D"]) inputX = 1;
                if (state.keys["ArrowUp"] || state.keys["w"] || state.keys["W"]) inputZ = -1; // 往前衝 (靠近遠處地平線)
                if (state.keys["ArrowDown"] || state.keys["s"] || state.keys["S"]) inputZ = 1;  // 往後退 (靠近自己螢幕)

                // 空白鍵判定
                if (state.keys[" "]) {
                    if (state.player.spacePressedTime === 0) {
                        state.player.spacePressedTime = Date.now();
                    }
                    const pressDuration = Date.now() - state.player.spacePressedTime;
                    // 超過 220 毫秒進入「長按」倒退滑行
                    if (pressDuration >= 220) {
                        inputZ = 1; // 強制往後倒退漂移
                        state.player.x += inputX * (state.player.speed * 0.4); // 減速左右
                        state.player.z += inputZ * (state.player.speed * 0.6); // 緩慢後退
                    } else {
                        state.player.x += inputX * state.player.speed;
                        state.player.z += inputZ * state.player.speed;
                    }
                } else {
                    state.player.x += inputX * state.player.speed;
                    state.player.z += inputZ * state.player.speed;
                }

                // 邊界安全限制
                state.player.x = Math.max(-175, Math.min(175, state.player.x));
                state.player.z = Math.max(25, Math.min(185, state.player.z));

                // 閃避及護盾狀態更新
                if (state.player.isDodging) {
                    state.player.dodgeTimer -= 1;
                    if (state.player.dodgeTimer <= 0) {
                        state.player.isDodging = false;
                    }
                }
                if (state.player.shieldActive) {
                    state.player.shieldTimeout -= 1;
                    if (state.player.shieldTimeout <= 0) {
                        state.player.shieldActive = false;
                    }
                }

                // --- 3. 盟友及對手高階防禦避險 AI ---
                const runAI = (char) => {
                    char.aiTimer -= 1;

                    // 雷達偵測：尋找正朝著自己滾落的近距離雪球
                    const threat = state.snowballs.find(ball => {
                        const depthGap = ball.z - char.z;
                        // 當雪球在自己前方，且距離較近時觸發高危防守
                        return depthGap > 0 && depthGap < 65 && Math.abs(ball.x - char.x) < 35;
                    });

                    if (threat) {
                        // 威脅應對：反向迅速逃逸
                        char.aiState = "escape";
                        if (threat.x < char.x) {
                            char.x += 3.2; // 往右閃躲
                        } else {
                            char.x -= 3.2; // 往左閃躲
                        }
                        
                        // 機率性觸發滾地翻滾
                        if (Math.random() < 0.02 && !char.isDodging) {
                            char.isDodging = true;
                            char.dodgeTimer = 25;
                            createBurstParticles(char.x, char.z, "#cbd5e1", 5);
                        }
                    } else {
                        // 平穩漫遊
                        if (char.aiTimer <= 0) {
                            char.aiState = Math.random() > 0.35 ? "wander" : "idle";
                            char.aiTimer = Math.random() * 50 + 20;
                            char.targetX = char.x + (Math.random() * 50 - 25);
                        }

                        if (char.aiState === "wander" && char.targetX !== undefined) {
                            const diffX = char.targetX - char.x;
                            if (Math.abs(diffX) > 4) {
                                char.x += Math.sign(diffX) * 1.5;
                            }
                        }
                    }

                    // 確保 AI 在跑道內
                    char.x = Math.max(-170, Math.min(170, char.x));

                    if (char.isDodging) {
                        char.dodgeTimer -= 1;
                        if (char.dodgeTimer <= 0) {
                            char.isDodging = false;
                        }
                    }
                };

                state.allies.forEach(a => { if (!a.isDead) runAI(a); });
                state.enemies.forEach(e => { if (!e.isDead) runAI(e); });

                // --- 4. 雪球生成規律控制 (隨著倒數前進逐漸瘋狂) ---
                const now = Date.now();
                const progressFactor = (35 - state.gameTimer) / 35; // 0 -> 1
                const spawnInterval = Math.max(450, 1300 - progressFactor * 850); 

                if (now - state.lastSnowballSpawn > spawnInterval) {
                    state.lastSnowballSpawn = now;
                    const isHuge = Math.random() < (0.2 + progressFactor * 0.15); // 後期大雪球比例上升
                    state.snowballs.push({
                        id: `ball_${now}`,
                        x: Math.random() * 300 - 150, // 遠處地平線生成橫坐標
                        z: 200,                        // 生成於地平線深處
                        size: isHuge ? "large" : "small",
                        damage: isHuge ? 10 : 5,
                        speed: (Math.random() * 2 + 3.8) + progressFactor * 1.5, // 速度遞增
                        spinAngle: 0
                    });
                }

                // --- 5. 雪球滾動位移與高精度 2.5D 碰撞檢測 ---
                state.snowballs = state.snowballs.filter(ball => {
                    ball.z -= ball.speed; // Z 減少即是向鏡頭（玩家）滾近
                    ball.spinAngle += 0.08;

                    // 超過最前端，自然滾出畫面
                    if (ball.z < 18) {
                        return false;
                    }

                    // 計算碰撞：因 2.5D 為近大遠小，碰撞判定 X 距離也需乘以該深度對應的 scale
                    const checkHit = (character) => {
                        const scaleFactor = (0.15 + (0.85 * (200 - character.z)) / 180);
                        const zGap = Math.abs(ball.z - character.z);
                        // 2D 橫向投射寬度判定半徑
                        const xGap = Math.abs(ball.x - character.x);

                        return zGap < 7 && xGap < (22 * scaleFactor);
                    };

                    // 玩家撞擊
                    if (!state.player.isDead && checkHit(state.player)) {
                        applyDamageToChar(ball, state.player, true);
                        return false; // 碎成雪泥消失
                    }

                    // 盟友撞擊
                    for (let a of state.allies) {
                        if (!a.isDead && checkHit(a)) {
                            applyDamageToChar(ball, a, false);
                            return false;
                        }
                    }

                    // 敵人撞擊
                    for (let e of state.enemies) {
                        if (!e.isDead && checkHit(e)) {
                            applyDamageToChar(ball, e, false);
                            return false;
                        }
                    }

                    return true;
                });

                // --- 6. 爆裂粒子與浮動戰鬥文字位移 ---
                state.particles = state.particles.filter(p => {
                    p.x += p.vx;
                    p.z += p.vz;
                    p.y += p.vy;
                    p.vy -= 0.12; // 重力加速度下墜
                    p.alpha -= 0.025;
                    return p.alpha > 0;
                });

                state.floatingTexts.forEach(t => {
                    t.y += t.speedY || 0.5;
                    t.alpha -= 0.02;
                });
                state.floatingTexts = state.floatingTexts.filter(t => t.alpha > 0);

                // --- 7. 即時勝負裁決 ---
                const blueAlive = !state.player.isDead || state.allies.some(a => !a.isDead);
                const redAlive = state.enemies.some(e => !e.isDead);

                if (!blueAlive) {
                    onFinishGame("LOSS");
                } else if (!redAlive) {
                    onFinishGame("WIN");
                }
            };

            const applyDamageToChar = (ball, char, isPlayerControlled) => {
                const state = engineState.current;

                if (char.isDodging) {
                    state.floatingTexts.push({
                        x: char.x,
                        z: char.z,
                        y: 35,
                        text: "MISS 迴避!",
                        color: "#94a3b8",
                        alpha: 1
                    });
                    createBurstParticles(char.x, char.z, "#cbd5e1", 4);
                    return;
                }

                if (isPlayerControlled && state.player.shieldActive) {
                    // 防護罩完美阻擋
                    state.player.shieldActive = false; // 盾碎
                    createBurstParticles(char.x, char.z, "#38bdf8", 15);
                    state.floatingTexts.push({
                        x: char.x,
                        z: char.z,
                        y: 38,
                        text: "SHIELD BREAK! 破盾",
                        color: "#ef4444",
                        alpha: 1
                    });
                    return;
                }

                // 實扣傷害
                char.hp = Math.max(0, char.hp - ball.damage);
                createBurstParticles(char.x, char.z, isPlayerControlled ? "#ef4444" : "#f43f5e", 10);
                
                state.floatingTexts.push({
                    x: char.x,
                    z: char.z,
                    y: 35,
                    text: `-${ball.damage} HP`,
                    color: isPlayerControlled ? "#ef4444" : "#f43f5e",
                    alpha: 1
                });

                if (char.hp <= 0) {
                    char.isDead = true;
                    createBurstParticles(char.x, char.z, "#ffffff", 20);
                    state.floatingTexts.push({
                        x: char.x,
                        z: char.z,
                        y: 45,
                        text: "💥 K.O. 戰損!",
                        color: "#94a3b8",
                        alpha: 1
                    });
                }
            };

            // ==================== 繪製總入口 ====================
            const drawFrame = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext("2d");
                const state = engineState.current;

                const w = canvas.width;
                const h = canvas.height;

                // 1. 極地冬夜天空
                const sky = ctx.createLinearGradient(0, 0, 0, 140);
                sky.addColorStop(0, "#030712");
                sky.addColorStop(0.5, "#0b1329");
                sky.addColorStop(1, "#1e1b4b");
                ctx.fillStyle = sky;
                ctx.fillRect(0, 0, w, h);

                // 畫遠景雪山與絢麗綠極光
                ctx.fillStyle = "rgba(45, 212, 191, 0.12)";
                ctx.beginPath();
                ctx.moveTo(0, 140);
                ctx.lineTo(w * 0.3, 50);
                ctx.lineTo(w * 0.6, 140);
                ctx.lineTo(w * 0.85, 40);
                ctx.lineTo(w, 140);
                ctx.fill();

                // 2. 冰面賽道大地底色
                ctx.fillStyle = "#0f172a";
                ctx.fillRect(0, 140, w, h - 140);

                const ice = ctx.createLinearGradient(0, 140, 0, h);
                ice.addColorStop(0, "#1e293b");
                ice.addColorStop(1, "#030712");
                ctx.fillStyle = ice;
                ctx.fillRect(0, 140, w, h - 140);

                // 3. 畫賽道分界格線
                ctx.strokeStyle = "rgba(56, 189, 248, 0.15)";
                ctx.lineWidth = 1.5;
                const lanes = 6;
                for (let i = 0; i <= lanes; i++) {
                    const xFar = -170 + (340 / lanes) * i;
                    const pFar = project(xFar, 0, 200, w, h);
                    const pNear = project(xFar, 0, 20, w, h);
                    ctx.beginPath();
                    ctx.moveTo(pFar.x, pFar.y);
                    ctx.lineTo(pNear.x, pNear.y);
                    ctx.stroke();
                }

                // 橫向透視距離線
                for (let zLine = 30; zLine <= 200; zLine += 25) {
                    const pL = project(-170, 0, zLine, w, h);
                    const pR = project(170, 0, zLine, w, h);
                    ctx.strokeStyle = `rgba(56, 189, 248, ${0.18 * (1 - zLine / 200)})`;
                    ctx.beginPath();
                    ctx.moveTo(pL.x, pL.y);
                    ctx.lineTo(pR.x, pR.y);
                    ctx.stroke();
                }

                // 4. 畫冰晶防禦樹（賽道左右兩側，增強 2.5D 前進感）
                for (let zTree = 30; zTree <= 200; zTree += 30) {
                    // 左側樹
                    drawPineTree(ctx, -190, zTree, w, h);
                    // 右側樹
                    drawPineTree(ctx, 190, zTree, w, h);
                }

                // 5. 排序渲染實體（由遠至近，避免遮擋錯誤）
                const queue = [];

                if (!state.player.isDead) {
                    queue.push({ type: "player", z: state.player.z, obj: state.player, name: user ? user.username : "玩家" });
                }
                state.allies.forEach(a => {
                    if (!a.isDead) queue.push({ type: "ally", z: a.z, obj: a, name: a.name });
                });
                state.enemies.forEach(e => {
                    if (!e.isDead) queue.push({ type: "enemy", z: e.z, obj: e, name: e.name });
                });
                state.snowballs.forEach(b => {
                    queue.push({ type: "snowball", z: b.z, obj: b });
                });

                // 按 Z 從遠到近排序 (Z值越大越遠，優先畫)
                queue.sort((a, b) => b.z - a.z);

                queue.forEach(node => {
                    if (node.type === "player") {
                        drawPlayer(ctx, node.obj, node.name, "#38bdf8", w, h, hasGoldCoat);
                    } else if (node.type === "ally") {
                        drawPlayer(ctx, node.obj, node.name, "#60a5fa", w, h, false);
                    } else if (node.type === "enemy") {
                        drawPlayer(ctx, node.obj, node.name, "#ef4444", w, h, false);
                    } else if (node.type === "snowball") {
                        drawSnowballEntity(ctx, node.obj, w, h);
                    }
                });

                // 6. 渲染爆裂碎片粒子
                state.particles.forEach(p => {
                    const pos = project(p.x, p.y, p.z, w, h);
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, Math.max(1, 3.5 * pos.scale), 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                // 7. 渲染浮動傷害/狀態文字
                state.floatingTexts.forEach(t => {
                    const pos = project(t.x, t.y, t.z, w, h);
                    ctx.save();
                    ctx.globalAlpha = t.alpha;
                    ctx.fillStyle = t.color;
                    ctx.font = `black ${Math.max(9, 12 * pos.scale)}px "Press Start 2P", Courier`;
                    ctx.textAlign = "center";
                    ctx.shadowColor = "#000";
                    ctx.shadowBlur = 4;
                    ctx.fillText(t.text, pos.x, pos.y);
                    ctx.restore();
                });

                // 8. 渲染背景與前景漫天飄雪
                ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
                state.backgroundSnow.forEach(s => {
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                // 9. 戰場定時大字
                ctx.fillStyle = "rgba(11, 19, 41, 0.85)";
                ctx.fillRect(w / 2 - 50, 10, 100, 30);
                ctx.strokeStyle = "rgba(56, 189, 248, 0.4)";
                ctx.strokeRect(w / 2 - 50, 10, 100, 30);

                ctx.font = 'bold 15px monospace';
                ctx.fillStyle = state.gameTimer <= 5 ? "#ef4444" : "#22d3ee";
                ctx.textAlign = "center";
                ctx.fillText(`⏱️ ${state.gameTimer}s`, w / 2, 30);
            };

            // 畫 pine tree
            const drawPineTree = (ctx, x3d, z3d, w, h) => {
                const pos = project(x3d, 0, z3d, w, h);
                const scale = pos.scale;
                const treeH = 50 * scale;
                const treeW = 16 * scale;

                // 樹幹
                ctx.fillStyle = "#475569";
                ctx.fillRect(pos.x - treeW * 0.2, pos.y - treeH * 0.25, treeW * 0.4, treeH * 0.25);

                // 樹葉
                ctx.fillStyle = `rgba(15, 118, 110, ${0.4 + (200 - z3d)/300})`;
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y - treeH);
                ctx.lineTo(pos.x - treeW, pos.y - treeH * 0.2);
                ctx.lineTo(pos.x + treeW, pos.y - treeH * 0.2);
                ctx.closePath();
                ctx.fill();

                // 頂部積雪
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y - treeH);
                ctx.lineTo(pos.x - treeW * 0.4, pos.y - treeH * 0.68);
                ctx.lineTo(pos.x + treeW * 0.4, pos.y - treeH * 0.68);
                ctx.closePath();
                ctx.fill();
            };

            // 畫精緻角色
            const drawPlayer = (ctx, char, name, themeColor, width, height, isGold) => {
                const pos = project(char.x, 0, char.z, width, height);
                const scale = pos.scale;
                const pHeight = 35 * scale;
                const pWidth = 18 * scale;

                ctx.save();

                // 旋轉翻滾
                if (char.isDodging) {
                    ctx.translate(pos.x, pos.y - pHeight / 2);
                    ctx.rotate((char.dodgeTimer / 30) * Math.PI * 4);
                    ctx.translate(-pos.x, -(pos.y - pHeight / 2));
                }

                // 冰面陰影
                ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
                ctx.beginPath();
                ctx.ellipse(pos.x, pos.y, pWidth * 1.1, pWidth * 0.4, 0, 0, Math.PI * 2);
                ctx.fill();

                // 大衣主體
                ctx.fillStyle = isGold ? "#fbbf24" : themeColor;
                ctx.strokeStyle = "#0f172a";
                ctx.lineWidth = 1 * scale + 0.5;

                ctx.beginPath();
                ctx.moveTo(pos.x - pWidth, pos.y);
                ctx.lineTo(pos.x - pWidth * 0.6, pos.y - pHeight);
                ctx.lineTo(pos.x + pWidth * 0.6, pos.y - pHeight);
                ctx.lineTo(pos.x + pWidth, pos.y);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 可愛毛帽
                ctx.fillStyle = isGold ? "#f59e0b" : "#1e293b";
                ctx.beginPath();
                ctx.arc(pos.x, pos.y - pHeight, pWidth * 0.75, Math.PI, 0, false);
                ctx.fill();
                ctx.stroke();

                // 滑雪護目鏡
                ctx.fillStyle = "#34d399";
                ctx.fillRect(pos.x - pWidth * 0.45, pos.y - pHeight + 2 * scale, pWidth * 0.9, 4 * scale);

                // 啟用中護盾外層
                if (char.shieldActive) {
                    ctx.restore();
                    ctx.save();
                    ctx.strokeStyle = "rgba(34, 211, 238, 0.85)";
                    ctx.shadowColor = "#22d3ee";
                    ctx.shadowBlur = 8;
                    ctx.lineWidth = 2 * scale + 1;
                    ctx.fillStyle = "rgba(34, 211, 238, 0.12)";
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y - pHeight / 2, pHeight * 1.05, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }

                ctx.restore();

                // 名字及 HP 顯示
                const uiY = pos.y - pHeight - 10 * scale;
                ctx.fillStyle = "#ffffff";
                ctx.font = `bold ${Math.max(9, 10 * scale)}px sans-serif`;
                ctx.textAlign = "center";
                ctx.fillText(name, pos.x, uiY);

                // HP
                const hpW = 32 * scale;
                const hpH = 3.5 * scale;
                ctx.fillStyle = "rgba(15, 23, 42, 0.75)";
                ctx.fillRect(pos.x - hpW / 2, uiY + 4 * scale, hpW, hpH);
                ctx.fillStyle = char.hp > 40 ? "#10b981" : "#ef4444";
                ctx.fillRect(pos.x - hpW / 2, uiY + 4 * scale, hpW * (char.hp / 100), hpH);
            };

            // 畫雪球
            const drawSnowballEntity = (ctx, ball, width, height) => {
                const pos = project(ball.x, 0, ball.z, width, height);
                const scale = pos.scale;
                const baseRad = ball.size === "large" ? 18 : 10;
                const rad = baseRad * scale;

                ctx.save();

                // 投影
                ctx.fillStyle = "rgba(0,0,0,0.25)";
                ctx.beginPath();
                ctx.ellipse(pos.x, pos.y + rad * 0.85, rad * 1.15, rad * 0.35, 0, 0, Math.PI * 2);
                ctx.fill();

                // 紋理旋轉
                ctx.translate(pos.x, pos.y);
                ctx.rotate(ball.spinAngle);

                // 炫彩雪球球體
                const radial = ctx.createRadialGradient(-rad * 0.25, -rad * 0.25, rad * 0.05, 0, 0, rad);
                radial.addColorStop(0, "#ffffff");
                radial.addColorStop(0.75, "#e2e8f0");
                radial.addColorStop(1, "#94a3b8");
                ctx.fillStyle = radial;

                ctx.beginPath();
                ctx.arc(0, 0, rad, 0, Math.PI * 2);
                ctx.fill();

                // 刻畫旋轉暗紋
                ctx.strokeStyle = "rgba(100, 116, 139, 0.35)";
                ctx.lineWidth = 1 * scale + 0.5;
                ctx.beginPath();
                ctx.arc(-rad * 0.2, 0, rad * 0.65, 0.3, Math.PI - 0.3);
                ctx.stroke();

                ctx.restore();
            };

            return (
                <div class="space-y-4 flex flex-col items-center">
                    
                    {/* 2.5D Canvas 顯示容器 */}
                    <div class="relative bg-slate-950 rounded-2xl overflow-hidden border-4 border-sky-400/80 shadow-2xl">
                        <canvas ref={canvasRef} width={800} height={450} class="block max-w-full w-full h-auto" />
                        
                        {/* 左上角提示 */}
                        <div class="absolute top-3 left-3 bg-slate-950/80 px-3 py-1.5 rounded-lg border border-sky-500/30 text-[10px] font-black text-sky-400 space-y-1 backdrop-blur-sm">
                            <span class="block text-green-400">🛡️ 現有戰略護盾：{playerStats.shields} 個</span>
                            <span class="block">快捷部署按鍵：鍵盤 F1 ~ F3</span>
                        </div>
                    </div>

                    {/* 控制區 */}
                    <div class="w-full bg-slate-950/90 p-4 rounded-xl border border-sky-950/60 grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
                        
                        {/* 1. 防禦部署熱鍵 */}
                        <div class="flex flex-col items-center gap-1.5">
                            <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">快捷護盾施放區</span>
                            <div class="flex gap-2">
                                <button 
                                    onClick={triggerShieldDeploy} 
                                    disabled={playerStats.shields < 1} 
                                    class={`px-3 py-2 rounded-lg text-xs font-black border transition-all ${playerStats.shields >= 1 ? "bg-sky-500/10 border-sky-400 text-sky-300 hover:bg-sky-500/20" : "bg-slate-900 border-slate-800 text-slate-600 cursor-not-allowed"}`}
                                >
                                    🛡️ 施放-F1
                                </button>
                                <button 
                                    onClick={triggerShieldDeploy} 
                                    disabled={playerStats.shields < 2} 
                                    class={`px-3 py-2 rounded-lg text-xs font-black border transition-all ${playerStats.shields >= 2 ? "bg-sky-500/10 border-sky-400 text-sky-300 hover:bg-sky-500/20" : "bg-slate-900 border-slate-800 text-slate-600 cursor-not-allowed"}`}
                                >
                                    🛡️ 施放-F2
                                </button>
                                <button 
                                    onClick={triggerShieldDeploy} 
                                    disabled={playerStats.shields < 3} 
                                    class={`px-3 py-2 rounded-lg text-xs font-black border transition-all ${playerStats.shields >= 3 ? "bg-sky-500/10 border-sky-400 text-sky-300 hover:bg-sky-500/20" : "bg-slate-900 border-slate-800 text-slate-600 cursor-not-allowed"}`}
                                >
                                    🛡️ 施放-F3
                                </button>
                            </div>
                        </div>

                        {/* 2. 空白鍵動作槽 */}
                        <div class="flex flex-col items-center gap-1">
                            <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">動作指令模擬</span>
                            <div class="flex gap-2">
                                <button 
                                    onMouseDown={() => {
                                        const state = engineState.current;
                                        if (!state.player.isDodging && !state.player.isDead) {
                                            state.player.isDodging = true;
                                            state.player.dodgeTimer = 30;
                                            createBurstParticles(state.player.x, state.player.z, "#e2e8f0", 8);
                                        }
                                    }}
                                    class="px-4 py-2 bg-gradient-to-r from-sky-400 to-blue-500 text-slate-950 font-black rounded-lg text-xs shadow-md"
                                >
                                    🔘 空白鍵: 翻滾
                                </button>
                                <button 
                                    onMouseDown={() => {
                                        engineState.current.keys[" "] = true;
                                        engineState.current.player.spacePressedTime = Date.now() - 300;
                                    }}
                                    onMouseUp={() => {
                                        engineState.current.keys[" "] = false;
                                        engineState.current.player.spacePressedTime = 0;
                                    }}
                                    onMouseLeave={() => {
                                        engineState.current.keys[" "] = false;
                                        engineState.current.player.spacePressedTime = 0;
                                    }}
                                    class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-slate-100 font-black rounded-lg text-xs"
                                >
                                    按住: 減速後退
                                </button>
                            </div>
                        </div>

                        {/* 3. 虛擬十字方向盤 */}
                        <div class="flex flex-col items-center gap-1">
                            <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">虛擬方向盤</span>
                            <div class="grid grid-cols-3 gap-1 w-28 text-center">
                                <div></div>
                                <button 
                                    onMouseDown={() => { engineState.current.keys["ArrowUp"] = true; }} 
                                    onMouseUp={() => { engineState.current.keys["ArrowUp"] = false; }} 
                                    onMouseLeave={() => { engineState.current.keys["ArrowUp"] = false; }} 
                                    class="bg-slate-900 border border-slate-800 p-1.5 rounded text-xs text-sky-400 font-bold active:bg-sky-400 active:text-slate-950"
                                >
                                    ▲
                                </button>
                                <div></div>
                                <button 
                                    onMouseDown={() => { engineState.current.keys["ArrowLeft"] = true; }} 
                                    onMouseUp={() => { engineState.current.keys["ArrowLeft"] = false; }} 
                                    onMouseLeave={() => { engineState.current.keys["ArrowLeft"] = false; }} 
                                    class="bg-slate-900 border border-slate-800 p-1.5 rounded text-xs text-sky-400 font-bold active:bg-sky-400 active:text-slate-950"
                                >
                                    ◀
                                </button>
                                <button 
                                    onMouseDown={() => { engineState.current.keys["ArrowDown"] = true; }} 
                                    onMouseUp={() => { engineState.current.keys["ArrowDown"] = false; }} 
                                    onMouseLeave={() => { engineState.current.keys["ArrowDown"] = false; }} 
                                    class="bg-slate-900 border border-slate-800 p-1.5 rounded text-xs text-sky-400 font-bold active:bg-sky-400 active:text-slate-950"
                                >
                                    ▼
                                </button>
                                <button 
                                    onMouseDown={() => { engineState.current.keys["ArrowRight"] = true; }} 
                                    onMouseUp={() => { engineState.current.keys["ArrowRight"] = false; }} 
                                    onMouseLeave={() => { engineState.current.keys["ArrowRight"] = false; }} 
                                    class="bg-slate-900 border border-slate-800 p-1.5 rounded text-xs text-sky-400 font-bold active:bg-sky-400 active:text-slate-950"
                                >
                                    ▶
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        // ==================== 啟動 React App ====================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
